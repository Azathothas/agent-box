# The configuration of cargo-deny. cargo-deny checks the advisories, the
# licenses, the duplicate versions and the sources of the dependencies.
#
# The gate runs it as its last step (`cargo xtask gate deny`):
#
#   cargo deny --locked check
#
# `cargo xtask setup` installs cargo-deny. CI installs a pinned release.

[graph]
# The targets that agent-box builds: the host binaries on Linux and Windows,
# and the static musl guest agent on x86_64 and aarch64. A crate that only
# another target compiles is in no build, and is not checked.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
# A yanked version is a version that its author withdrew. Do not build on it.
yanked = "deny"
# Each ignored advisory names its reason and the date somebody read it.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Each license that a crate of the graph can have, by its SPDX name. A crate
# offered under a choice is checked against the choice.
allow = [
  "0BSD",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# This list is the policy, not a list of the licenses in use today. A license
# in the list that no crate has is not a warning.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate make the build larger and slower. This is a
# warning: an upstream crate can cause it, and only an upstream release can
# remove it.
multiple-versions = "warn"

[sources]
# Each dependency comes from crates.io. A crate from another registry or from
# a git repository is refused until this file names that source.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
